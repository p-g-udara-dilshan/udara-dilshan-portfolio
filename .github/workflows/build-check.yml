name: Verify static portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check static configuration and images
        run: npm run check:static
      - name: Build frontend
        run: npm run build
      - name: Verify all-page build outputs
        run: npm run check:build
